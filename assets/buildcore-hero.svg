      <g transform="translate(44 84)">
        <rect x="0" y="0" width="86" height="48" rx="11" fill="#777E8A"/>
        <rect x="94" y="0" width="86" height="48" rx="11" fill="#F5B51B"/>
        <rect x="188" y="0" width="86" height="48" rx="11" fill="#777E8A"/>
      </g>
      <g transform="translate(66 140)">
        <rect x="0" y="0" width="86" height="48" rx="11" fill="#454B57"/>
        <rect x="94" y="0" width="86" height="48" rx="11" fill="#777E8A"/>
        <rect x="188" y="0" width="86" height="48" rx="11" fill="#F5B51B"/>
      </g>
      <g transform="translate(36 196)">
        <rect x="0" y="0" width="86" height="48" rx="11" fill="#F5B51B"/>
        <rect x="94" y="0" width="86" height="48" rx="11" fill="#454B57"/>
        <rect x="188" y="0" width="86" height="48" rx="11" fill="#777E8A"/>
      </g>
      <g transform="translate(64 252)">
        <rect x="0" y="0" width="86" height="48" rx="11" fill="#777E8A"/>
        <rect x="94" y="0" width="86" height="48" rx="11" fill="#F5B51B"/>
        <rect x="188" y="0" width="86" height="48" rx="11" fill="#454B57"/>
      </g>
    </g>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -10;0 0" dur="5s" repeatCount="indefinite"/>
  </g>

  <rect x="1" y="1" width="1198" height="498" rx="29" stroke="#F5B51B" stroke-opacity=".28" stroke-width="2"/>
  <rect x="0" y="0" width="1200" height="7" rx="3" fill="url(#gold)" opacity=".9"/>
</svg>