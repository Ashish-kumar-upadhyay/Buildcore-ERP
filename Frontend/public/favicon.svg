<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1F2937"/>
  
  <!-- Building/Construction Icon -->
  <g transform="translate(12, 12)">
    <!-- Main Building Structure -->
    <rect x="8" y="20" width="28" height="24" rx="2" fill="url(#grad1)"/>
    
    <!-- Roof -->
    <polygon points="6,20 22,4 38,20" fill="#F59E0B"/>
    
    <!-- Windows -->
    <rect x="12" y="24" width="6" height="6" rx="1" fill="#1F2937"/>
    <rect x="26" y="24" width="6" height="6" rx="1" fill="#1F2937"/>
    <rect x="12" y="34" width="6" height="6" rx="1" fill="#1F2937"/>
    <rect x="26" y="34" width="6" height="6" rx="1" fill="#1F2937"/>
    
    <!-- Door -->
    <rect x="17" y="32" width="10" height="12" rx="1" fill="#FEF3C7"/>
    <circle cx="25" cy="38" r="1.5" fill="#D97706"/>
    
    <!-- Crane/Construction Element -->
    <g transform="translate(30, 15)">
      <rect x="0" y="0" width="3" height="25" rx="1" fill="url(#grad2)"/>
      <rect x="-2" y="0" width="14" height="3" rx="1" fill="url(#grad2)"/>
      <line x1="1.5" y1="0" x2="1.5" y2="-8" stroke="url(#grad2)" stroke-width="2"/>
      <rect x="-4" y="-12" width="11" height="4" rx="1" fill="url(#grad2)"/>
    </g>
  </g>
  
  <!-- Bricks Pattern -->
  <g opacity="0.3">
    <rect x="8" y="52" width="8" height="4" rx="1" fill="#F59E0B"/>
    <rect x="18" y="52" width="8" height="4" rx="1" fill="#F59E0B"/>
    <rect x="28" y="52" width="8" height="4" rx="1" fill="#F59E0B"/>
    <rect x="38" y="52" width="8" height="4" rx="1" fill="#F59E0B"/>
    <rect x="48" y="52" width="8" height="4" rx="1" fill="#F59E0B"/>
  </g>
</svg>